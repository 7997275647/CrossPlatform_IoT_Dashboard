name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, analyze, and test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang-tidy \
            ninja-build

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true

      # - name: Configure
      #   run: >
      #     cmake -S . -B build
      #     -G Ninja
      #     -DCMAKE_BUILD_TYPE=Debug
      #     -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run QML static analysis
        run: |
          find . -not -path './build/*' -name '*.qml' -print0 |
            xargs -0 -r -n1 qmllint

      # - name: Run C++ static analysis
      #   run: clang-tidy main.cpp -p build --warnings-as-errors='*'

      # - name: Build
      #   run: cmake --build build --parallel

      # - name: Upload built application
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: QtSensorDash-linux
      #     path: build/appQtSensorDash
      #     if-no-files-found: error
      #     retention-days: 14

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
